name: Score Submission (PR -> Leaderboard)

# pull_request_target runs with repo secrets, so the PR checkout is treated strictly as DATA:
# only scripts from the trusted main branch are executed, and participant-controlled values are
# passed through env vars / files, never interpolated into shell code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "submissions/inbox/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: leaderboard-update
  cancel-in-progress: false

jobs:
  score_and_update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch (trusted code)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: repo_main

      - name: Checkout PR head (submission data only)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: repo_pr
          persist-credentials: false

      - name: Detect and validate changed files
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const name = "[A-Za-z0-9][A-Za-z0-9_.-]{0,63}";
            const allowed = new RegExp(`^submissions/inbox/${name}/${name}/(predictions\\.csv\\.enc|metadata\\.json)$`);
            const blocked = files.filter(f => !allowed.test(f.filename) || f.status === "removed" || f.status === "renamed");
            if (blocked.length) {
              core.setOutput("error", "This PR may only add `predictions.csv.enc` and `metadata.json` under " +
                "`submissions/inbox/<team>/<run_id>/` (team/run_id: letters, digits, `_`, `-`, `.`). Offending files:\n" +
                blocked.map(f => `- \`${f.filename}\` (${f.status})`).join("\n"));
              core.setFailed("Blocked files in PR");
              return;
            }
            const dirs = [...new Set(files.map(f => f.filename.split("/").slice(0, -1).join("/")))];
            const names = files.map(f => f.filename.split("/").pop()).sort().join(",");
            if (dirs.length !== 1 || names !== "metadata.json,predictions.csv.enc") {
              core.setOutput("error", "Each PR must contain exactly one `predictions.csv.enc` and one `metadata.json`, in the same run folder.");
              core.setFailed("Wrong submission file set");
              return;
            }
            core.setOutput("run_dir", dirs[0]);

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy cryptography

      - name: Restore hidden test labels and private key (secrets)
        shell: bash
        env:
          L1: ${{ secrets.TEST_LABELS_B64_01 }}
          L2: ${{ secrets.TEST_LABELS_B64_02 }}
          L3: ${{ secrets.TEST_LABELS_B64_03 }}
          L4: ${{ secrets.TEST_LABELS_B64_04 }}
          L5: ${{ secrets.TEST_LABELS_B64_05 }}
          L6: ${{ secrets.TEST_LABELS_B64_06 }}
          L7: ${{ secrets.TEST_LABELS_B64_07 }}
          L8: ${{ secrets.TEST_LABELS_B64_08 }}
          K1: ${{ secrets.SUBMISSION_PRIVATE_KEY_B64_01 }}
          K2: ${{ secrets.SUBMISSION_PRIVATE_KEY_B64_02 }}
          K3: ${{ secrets.SUBMISSION_PRIVATE_KEY_B64_03 }}
          K4: ${{ secrets.SUBMISSION_PRIVATE_KEY_B64_04 }}
          K5: ${{ secrets.SUBMISSION_PRIVATE_KEY_B64_05 }}
          K6: ${{ secrets.SUBMISSION_PRIVATE_KEY_B64_06 }}
          K7: ${{ secrets.SUBMISSION_PRIVATE_KEY_B64_07 }}
          K8: ${{ secrets.SUBMISSION_PRIVATE_KEY_B64_08 }}
        run: |
          set -euo pipefail
          mkdir -p repo_main/data/private
          printf "%s" "$L1$L2$L3$L4$L5$L6$L7$L8" | base64 -d > repo_main/data/private/test_labels.csv
          printf "%s" "$K1$K2$K3$K4$K5$K6$K7$K8" | base64 -d > repo_main/data/private/submission_private_key.pem
          test -s repo_main/data/private/test_labels.csv || { echo "Missing TEST_LABELS_B64_* secrets"; exit 1; }
          test -s repo_main/data/private/submission_private_key.pem || { echo "Missing SUBMISSION_PRIVATE_KEY_B64_* secrets"; exit 1; }

      - name: Validate, decrypt, score, update leaderboard
        working-directory: repo_main
        env:
          RUN_DIR: ${{ steps.detect.outputs.run_dir }}
          GH_USER: ${{ github.event.pull_request.user.login }}
          RESULT: ${{ runner.temp }}/result.json
        run: |
          python scoring/ci_score.py \
            --pr-root ../repo_pr \
            --run-dir "$RUN_DIR" \
            --key data/private/submission_private_key.pem \
            --github-user "$GH_USER" \
            --result "$RESULT"

      - name: Remove private files
        if: always()
        run: rm -rf repo_main/data/private

      - name: Commit leaderboard + archived submission to main
        working-directory: repo_main
        env:
          RUN_DIR: ${{ steps.detect.outputs.run_dir }}
          GH_USER: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leaderboard/ docs/leaderboard.csv "$RUN_DIR"
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Leaderboard update: $RUN_DIR (by @$GH_USER)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 5; done
          exit 1

      - name: Comment result on PR
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT: ${{ runner.temp }}/result.json
          DETECT_ERROR: ${{ steps.detect.outputs.error }}
        with:
          script: |
            const fs = require("fs");
            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            let r = null;
            if (fs.existsSync(process.env.RESULT)) r = JSON.parse(fs.readFileSync(process.env.RESULT, "utf8"));
            const pages = `https://${owner}.github.io/${repo}/`;
            const f = x => (typeof x === "number" && isFinite(x) ? x.toFixed(4) : "—");
            let body;
            if (r && r.ok) {
              body = [
                "### ✅ Submission scored",
                "",
                `| Team | Run | mAP@0.5 | AP RBC | AP WBC | AP Platelets | Rank |`,
                `|---|---|---:|---:|---:|---:|---:|`,
                `| \`${r.team}\` | \`${r.run_id}\` | **${f(r.map50)}** | ${f(r.ap_RBC)} | ${f(r.ap_WBC)} | ${f(r.ap_Platelets)} | ${r.rank} / ${r.total} |`,
                "",
                `Leaderboard: ${pages}`,
                "",
                "The leaderboard was updated on `main` directly, so this PR is closed automatically (no merge needed).",
              ].join("\n");
            } else {
              const err = (r && r.error) || process.env.DETECT_ERROR || "The scoring job failed before producing a result. See the workflow logs.";
              body = `### ❌ Submission rejected\n\n${err}\n\nFix the problem and push again to this PR to re-run scoring.`;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
            if (r && r.ok) {
              await github.rest.pulls.update({ owner, repo, pull_number: issue_number, state: "closed" });
            }
